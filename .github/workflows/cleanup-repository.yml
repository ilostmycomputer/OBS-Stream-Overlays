name: Remove repository maintenance bloat

on:
  push:
    paths:
      - .github/workflows/cleanup-repository.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm typing notification files still pass
        working-directory: overlays/typing-notifications
        run: |
          npm ci
          npm run check

      - name: Remove developer-only maintenance files
        shell: python
        run: |
          from pathlib import Path
          import shutil

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old_readme = (
              "For this feature, downloading the repository ZIP is usually easier. "
              "You may then delete or ignore the countdown, confetti, gradient, `.github`, "
              "`docs`, and `scripts` folders."
          )
          new_readme = (
              "For this feature, downloading the repository ZIP is usually easier. "
              "You may then delete or ignore the countdown, confetti, gradient, and `docs` folders."
          )
          if old_readme not in readme:
              raise SystemExit("Expected README cleanup sentence was not found.")
          readme_path.write_text(readme.replace(old_readme, new_readme, 1), encoding="utf-8")

          guide_path = Path("FULL_GUIDE.md")
          guide = guide_path.read_text(encoding="utf-8")
          start = guide.find("# Repository checks\n")
          end = guide.find("# Security and privacy\n", start)
          if start == -1 or end == -1:
              raise SystemExit("Repository checks section was not found in FULL_GUIDE.md.")

          section_start = guide.rfind("---\n\n", 0, start)
          if section_start == -1:
              section_start = start
          guide = guide[:section_start] + "---\n\n" + guide[end:]
          guide_path.write_text(guide, encoding="utf-8")

          shutil.rmtree("scripts")
          Path(".github/workflows/validate.yml").unlink()
          Path(".github/workflows/cleanup-repository.yml").unlink()

      - name: Commit cleaned repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove repository maintenance bloat"
          git push
