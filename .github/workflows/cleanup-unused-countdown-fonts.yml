name: Clean up unused countdown fonts

on:
  push:
    paths:
      - .github/workflows/cleanup-unused-countdown-fonts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove unused fonts and update references
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          countdown_dir = Path("Overlays & Plugins/overlays/countdown")
          unused = [
              countdown_dir / "OpenAI-Sans-Regular.otf",
              countdown_dir / "OpenAI-Sans-Semibold.otf",
          ]
          required = [
              countdown_dir / "OpenAI-Sans-Light.otf",
              countdown_dir / "OpenAI-Sans-Medium.otf",
              countdown_dir / "OpenAI-Sans-Bold.otf",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Required countdown font is missing: {path}")

          for path in unused:
              if not path.is_file():
                  raise SystemExit(f"Unused font expected for cleanup is missing: {path}")
              subprocess.run(["git", "rm", str(path)], check=True)

          replacements = {
              "five OpenAI Sans font files": "three OpenAI Sans font files",
              "five bundled OpenAI Sans `.otf` files": "three bundled OpenAI Sans `.otf` files",
              "Select the five `OpenAI-Sans-*.otf` files.": (
                  "Select `OpenAI-Sans-Bold.otf`, `OpenAI-Sans-Medium.otf`, "
                  "and `OpenAI-Sans-Light.otf`."
              ),
          }

          unused_names = {path.name for path in unused}
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              if not path.exists() or path == Path(".github/workflows/cleanup-unused-countdown-fonts.yml"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue

              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              kept_lines = []
              for line in updated.splitlines(keepends=True):
                  if any(name in line for name in unused_names):
                      stripped = line.strip()
                      removable = (
                          stripped.startswith("- `OpenAI-Sans-")
                          or stripped.startswith('"OpenAI-Sans-')
                          or stripped.startswith("'OpenAI-Sans-")
                      )
                      if removable:
                          continue
                  kept_lines.append(line)
              updated = "".join(kept_lines)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          remaining = subprocess.run(
              [
                  "git",
                  "grep",
                  "-n",
                  "-E",
                  "OpenAI-Sans-(Regular|Semibold)\\.otf|five (bundled )?OpenAI Sans",
              ],
              text=True,
              capture_output=True,
          )
          if remaining.returncode == 0:
              raise SystemExit("Stale unused-font references remain:\n" + remaining.stdout)
          if remaining.returncode not in (0, 1):
              raise SystemExit(remaining.stderr)

      - name: Validate countdown font usage and repository
        shell: bash
        run: |
          test -f "Overlays & Plugins/overlays/countdown/OpenAI-Sans-Light.otf"
          test -f "Overlays & Plugins/overlays/countdown/OpenAI-Sans-Medium.otf"
          test -f "Overlays & Plugins/overlays/countdown/OpenAI-Sans-Bold.otf"
          test ! -e "Overlays & Plugins/overlays/countdown/OpenAI-Sans-Regular.otf"
          test ! -e "Overlays & Plugins/overlays/countdown/OpenAI-Sans-Semibold.otf"

          grep -q 'font-weight: 300' "Overlays & Plugins/overlays/countdown/summer-update-countdown.html"
          grep -q 'font-weight: 500' "Overlays & Plugins/overlays/countdown/summer-update-countdown.html"
          grep -q 'font-weight: 700' "Overlays & Plugins/overlays/countdown/summer-update-countdown.html"
          grep -q 'font-weight: 300' "Overlays & Plugins/overlays/countdown/summer-update-countdown-dark.html"
          grep -q 'font-weight: 500' "Overlays & Plugins/overlays/countdown/summer-update-countdown-dark.html"
          grep -q 'font-weight: 700' "Overlays & Plugins/overlays/countdown/summer-update-countdown-dark.html"

          while IFS= read -r -d '' test_file; do
            node "$test_file"
          done < <(find . -name 'validate-repository.mjs' -print0)

          while IFS= read -r -d '' test_file; do
            node "$test_file"
          done < <(find . -name 'test-countdown-lifecycle.mjs' -print0)

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/cleanup-unused-countdown-fonts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused countdown fonts"
          git push
