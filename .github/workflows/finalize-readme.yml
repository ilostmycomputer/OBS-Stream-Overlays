name: Finalise README

on:
  push:
    paths:
      - .github/workflows/finalize-readme.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add troubleshooting guidance
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          sentence = "If you're stuck, I highly recommend using AI to troubleshoot."
          marker = "# Troubleshooting\n"
          addition = (
              "# Troubleshooting\n\n"
              "> **Need more help?** If you're stuck, I highly recommend using AI to troubleshoot. "
              "Give it the exact error message, the step you reached, and the relevant OBS, Node.js, "
              "Vencord, or Browser Source settings. Never share passwords, cookies, account tokens, "
              "or other private credentials, and verify suggested commands before running them.\n"
          )

          if sentence not in text:
              if marker not in text:
                  raise SystemExit("Troubleshooting heading was not found.")
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding="utf-8")

      - name: Validate repository
        run: node scripts/validate-repository.mjs

      - name: Commit final README
        run: |
          rm .github/workflows/finalize-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/finalize-readme.yml
          git commit -m "Finalise troubleshooting guidance"
          git push
