name: Finalise SGS guidance

on:
  push:
    paths:
      - .github/workflows/finalize-sgs-guidance.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add installer guidance
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          sentence = "Using the compiled installer is the easy way to install Stroke Glow Shadow"
          marker = (
              "4. Download the compiled installer. Do not download GitHub's automatically\n"
              "   generated **Source code (zip)** archive.\n"
          )
          addition = marker + (
              "\nUsing the compiled installer is the easy way to install Stroke Glow Shadow: "
              "run it, follow the prompts, and reopen OBS. The **Source code (zip)** archive "
              "is not an installer.\n"
          )

          if sentence not in text:
              if marker not in text:
                  raise SystemExit("Stroke Glow Shadow download instructions were not found.")
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding="utf-8")

      - name: Validate repository
        run: |
          node scripts/validate-repository.mjs
          node scripts/test-countdown-lifecycle.mjs

      - name: Commit final guidance
        run: |
          rm .github/workflows/finalize-sgs-guidance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/finalize-sgs-guidance.yml
          git commit -m "Clarify easy SGS installer setup"
          git push
