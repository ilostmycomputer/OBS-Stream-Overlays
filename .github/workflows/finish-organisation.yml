name: Finish repository organisation

on:
  push:
    paths:
      - .github/workflows/finish-organisation.yml

permissions:
  contents: write

jobs:
  organise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Organise countdown and repair documentation paths
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          countdown = root / "Overlays & Plugins" / "overlays" / "countdown"
          fonts = countdown / "fonts"
          stream = countdown / "stream-countdown"
          summer = countdown / "summer-update-countdown"

          for folder in (fonts, stream, summer):
              folder.mkdir(parents=True, exist_ok=True)

          moves = {
              countdown / "OpenAI-Sans-Bold.otf": fonts / "OpenAI-Sans-Bold.otf",
              countdown / "OpenAI-Sans-Light.otf": fonts / "OpenAI-Sans-Light.otf",
              countdown / "OpenAI-Sans-Medium.otf": fonts / "OpenAI-Sans-Medium.otf",
              countdown / "stream-countdown.html": stream / "stream-countdown.html",
              countdown / "stream-countdown-dark.html": stream / "stream-countdown-dark.html",
              countdown / "summer-update-countdown.html": summer / "summer-update-countdown.html",
              countdown / "summer-update-countdown-dark.html": summer / "summer-update-countdown-dark.html",
          }

          for source, destination in moves.items():
              if not source.is_file():
                  raise SystemExit(f"Missing source file: {source}")
              subprocess.run(["git", "mv", str(source), str(destination)], check=True)

          # The stream countdown directly loads the bundled bold font. Only its
          # relative asset path changes; visual/functional behaviour stays the same.
          for path in (
              stream / "stream-countdown.html",
              stream / "stream-countdown-dark.html",
          ):
              text = path.read_text(encoding="utf-8")
              old = 'src: url("./OpenAI-Sans-Bold.otf") format("opentype");'
              new = 'src: url("../fonts/OpenAI-Sans-Bold.otf") format("opentype");'
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one old font URL in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replacements = [
              # Earlier overlay categorisation.
              ("Overlays & Plugins/overlays/typing-notifications", "Overlays & Plugins/overlays/notifications/typing-notifications"),
              ("Overlays%20%26%20Plugins/overlays/typing-notifications", "Overlays%20%26%20Plugins/overlays/notifications/typing-notifications"),
              (r"Overlays & Plugins\overlays\typing-notifications", r"Overlays & Plugins\overlays\notifications\typing-notifications"),
              ("Overlays & Plugins/overlays/confetti", "Overlays & Plugins/overlays/visual-effects/confetti"),
              ("Overlays%20%26%20Plugins/overlays/confetti", "Overlays%20%26%20Plugins/overlays/visual-effects/confetti"),
              (r"Overlays & Plugins\overlays\confetti", r"Overlays & Plugins\overlays\visual-effects\confetti"),
              ("Overlays & Plugins/overlays/gradient-stroke", "Overlays & Plugins/overlays/visual-effects/gradient-stroke"),
              ("Overlays%20%26%20Plugins/overlays/gradient-stroke", "Overlays%20%26%20Plugins/overlays/visual-effects/gradient-stroke"),
              (r"Overlays & Plugins\overlays\gradient-stroke", r"Overlays & Plugins\overlays\visual-effects\gradient-stroke"),

              # Countdown subfolders. Dark variants first so the shorter names do not interfere.
              ("Overlays & Plugins/overlays/countdown/stream-countdown-dark.html", "Overlays & Plugins/overlays/countdown/stream-countdown/stream-countdown-dark.html"),
              ("Overlays%20%26%20Plugins/overlays/countdown/stream-countdown-dark.html", "Overlays%20%26%20Plugins/overlays/countdown/stream-countdown/stream-countdown-dark.html"),
              (r"Overlays & Plugins\overlays\countdown\stream-countdown-dark.html", r"Overlays & Plugins\overlays\countdown\stream-countdown\stream-countdown-dark.html"),
              ("Overlays & Plugins/overlays/countdown/stream-countdown.html", "Overlays & Plugins/overlays/countdown/stream-countdown/stream-countdown.html"),
              ("Overlays%20%26%20Plugins/overlays/countdown/stream-countdown.html", "Overlays%20%26%20Plugins/overlays/countdown/stream-countdown/stream-countdown.html"),
              (r"Overlays & Plugins\overlays\countdown\stream-countdown.html", r"Overlays & Plugins\overlays\countdown\stream-countdown\stream-countdown.html"),
              ("Overlays & Plugins/overlays/countdown/summer-update-countdown-dark.html", "Overlays & Plugins/overlays/countdown/summer-update-countdown/summer-update-countdown-dark.html"),
              ("Overlays%20%26%20Plugins/overlays/countdown/summer-update-countdown-dark.html", "Overlays%20%26%20Plugins/overlays/countdown/summer-update-countdown/summer-update-countdown-dark.html"),
              (r"Overlays & Plugins\overlays\countdown\summer-update-countdown-dark.html", r"Overlays & Plugins\overlays\countdown\summer-update-countdown\summer-update-countdown-dark.html"),
              ("Overlays & Plugins/overlays/countdown/summer-update-countdown.html", "Overlays & Plugins/overlays/countdown/summer-update-countdown/summer-update-countdown.html"),
              ("Overlays%20%26%20Plugins/overlays/countdown/summer-update-countdown.html", "Overlays%20%26%20Plugins/overlays/countdown/summer-update-countdown/summer-update-countdown.html"),
              (r"Overlays & Plugins\overlays\countdown\summer-update-countdown.html", r"Overlays & Plugins\overlays\countdown\summer-update-countdown\summer-update-countdown.html"),
          ]

          # Documentation/reference files only. Runtime source is deliberately excluded.
          documentation_files = [root / "README.md"]
          documentation_files.extend((root / "Documentation").rglob("*.md"))

          for path in documentation_files:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)

              # Font-folder wording and direct references.
              updated = updated.replace(
                  "The three OpenAI Sans font files in `Overlays & Plugins/overlays/countdown/`",
                  "The three OpenAI Sans font files in `Overlays & Plugins/overlays/countdown/fonts/`",
              )
              updated = updated.replace(
                  "font files beside the countdown in `Overlays & Plugins/overlays/countdown/`",
                  "font files in `Overlays & Plugins/overlays/countdown/fonts/`",
              )
              updated = updated.replace(
                  r"Open `Overlays & Plugins\overlays\countdown`.",
                  r"Open `Overlays & Plugins\overlays\countdown\fonts`.",
              )
              updated = updated.replace(
                  "`OpenAI-Sans-Bold.otf` in the same folder",
                  "`OpenAI-Sans-Bold.otf` in the sibling `fonts` folder",
              )

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

      - name: Verify organisation
        shell: bash
        run: |
          set -euo pipefail
          test -f "Overlays & Plugins/overlays/countdown/fonts/OpenAI-Sans-Bold.otf"
          test -f "Overlays & Plugins/overlays/countdown/fonts/OpenAI-Sans-Light.otf"
          test -f "Overlays & Plugins/overlays/countdown/fonts/OpenAI-Sans-Medium.otf"
          test -f "Overlays & Plugins/overlays/countdown/stream-countdown/stream-countdown.html"
          test -f "Overlays & Plugins/overlays/countdown/stream-countdown/stream-countdown-dark.html"
          test -f "Overlays & Plugins/overlays/countdown/summer-update-countdown/summer-update-countdown.html"
          test -f "Overlays & Plugins/overlays/countdown/summer-update-countdown/summer-update-countdown-dark.html"

          test ! -e "Overlays & Plugins/overlays/countdown/OpenAI-Sans-Bold.otf"
          test ! -e "Overlays & Plugins/overlays/countdown/stream-countdown.html"
          test ! -e "Overlays & Plugins/overlays/countdown/summer-update-countdown.html"

          grep -Fq 'url("../fonts/OpenAI-Sans-Bold.otf")' "Overlays & Plugins/overlays/countdown/stream-countdown/stream-countdown.html"
          grep -Fq 'url("../fonts/OpenAI-Sans-Bold.otf")' "Overlays & Plugins/overlays/countdown/stream-countdown/stream-countdown-dark.html"

          if git grep -n -E 'Overlays (&|%20%26%20) Plugins/overlays/(typing-notifications|confetti|gradient-stroke)' -- '*.md'; then
            echo "Stale categorisation paths remain in documentation."
            exit 1
          fi

          if git grep -n -E 'Overlays (&|%20%26%20) Plugins/overlays/countdown/(stream-countdown(-dark)?|summer-update-countdown(-dark)?)\.html' -- '*.md'; then
            echo "Stale countdown file paths remain in documentation."
            exit 1
          fi

          git diff --check

      - name: Commit organised layout
        shell: bash
        run: |
          rm .github/workflows/finish-organisation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organise countdown assets and documentation"
          git push
