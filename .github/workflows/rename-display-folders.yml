name: Rename display folders

on:
  push:
    paths:
      - .github/workflows/rename-display-folders.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename folders and update references
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          renames = [
              ("overlays and plugins", "Overlays & Plugins"),
              ("2-DOCUMENTATION", "Documentation"),
          ]

          for old_name, new_name in renames:
              old_path = Path(old_name)
              new_path = Path(new_name)
              if not old_path.is_dir():
                  raise SystemExit(f"Missing source folder: {old_name}")
              if new_path.exists():
                  raise SystemExit(f"Destination already exists: {new_name}")
              subprocess.run(["git", "mv", old_name, new_name], check=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue

              updated = text
              updated = updated.replace(
                  "overlays%20and%20plugins",
                  "Overlays%20%26%20Plugins",
              )
              updated = updated.replace(
                  "overlays and plugins",
                  "Overlays & Plugins",
              )
              updated = updated.replace("2-DOCUMENTATION", "Documentation")

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          for stale in ("overlays and plugins", "2-DOCUMENTATION"):
              remaining = subprocess.run(
                  ["git", "grep", "-n", stale],
                  text=True,
                  capture_output=True,
              )
              if remaining.returncode == 0:
                  raise SystemExit(
                      f"Stale references to {stale!r} remain:\n" + remaining.stdout
                  )
              if remaining.returncode not in (0, 1):
                  raise SystemExit(remaining.stderr)

      - name: Validate repository
        shell: bash
        run: |
          test -d "Overlays & Plugins"
          test -d "Documentation"
          test ! -e "overlays and plugins"
          test ! -e "2-DOCUMENTATION"
          if [ -f scripts/validate-repository.mjs ]; then
            node scripts/validate-repository.mjs
          fi
          if [ -f scripts/test-countdown-lifecycle.mjs ]; then
            node scripts/test-countdown-lifecycle.mjs
          fi

      - name: Commit rename
        shell: bash
        run: |
          rm .github/workflows/rename-display-folders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename top-level folders"
          git push
