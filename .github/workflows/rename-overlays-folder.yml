name: Rename overlays folder

on:
  push:
    paths:
      - .github/workflows/rename-overlays-folder.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename folder and update references
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          old_name = "1-OVERLAYS-AND-TYPING-PLUGIN"
          new_name = "overlays and plugins"
          old_path = Path(old_name)
          new_path = Path(new_name)

          if not old_path.is_dir():
              raise SystemExit(f"Missing source folder: {old_name}")
          if new_path.exists():
              raise SystemExit(f"Destination already exists: {new_name}")

          subprocess.run(["git", "mv", old_name, new_name], check=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue

              updated = text
              updated = updated.replace(
                  f"../{old_name}/",
                  "../overlays%20and%20plugins/",
              )
              updated = updated.replace(
                  f"({old_name}/",
                  "(overlays%20and%20plugins/",
              )
              updated = updated.replace(old_name, new_name)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          remaining = subprocess.run(
              ["git", "grep", "-n", old_name],
              text=True,
              capture_output=True,
          )
          if remaining.returncode == 0:
              raise SystemExit(
                  "Stale folder references remain:\n" + remaining.stdout
              )
          if remaining.returncode not in (0, 1):
              raise SystemExit(remaining.stderr)

      - name: Validate repository
        shell: bash
        run: |
          test -d "overlays and plugins"
          test ! -e "1-OVERLAYS-AND-TYPING-PLUGIN"
          if [ -f scripts/validate-repository.mjs ]; then
            node scripts/validate-repository.mjs
          fi
          if [ -f scripts/test-countdown-lifecycle.mjs ]; then
            node scripts/test-countdown-lifecycle.mjs
          fi

      - name: Commit rename
        shell: bash
        run: |
          rm .github/workflows/rename-overlays-folder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename overlays and plugins folder"
          git push
