name: Apply selective download guidance

on:
  push:
    paths:
      - .github/workflows/validate.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add per-overlay download guidance
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "# Beginner setup\n\n## Download the files\n"
          replacement = """# Beginner setup

## Download only the overlay you want

You do **not** need to install or keep this entire repository when you only want
one overlay. This repository is a collection of separate files, not one program.
Download the files listed for your chosen feature and ignore the other folders.

| Feature | Files needed from this repository | Other software or access needed |
| --- | --- | --- |
| **Countdown** | [`overlays/countdown/summer-update-countdown.html`](overlays/countdown/summer-update-countdown.html) | OBS Studio. The five `OpenAI-Sans-*.otf` files in the same folder are optional and only provide the intended typography. |
| **Confetti** | [`overlays/confetti/confetti.html`](overlays/confetti/confetti.html) | OBS Studio only. |
| **Animated YouTube Studio subscriber count** | [`overlays/gradient-stroke/gradient.html`](overlays/gradient-stroke/gradient.html) | OBS Studio, access to your channel in YouTube Studio, and the compiled Stroke Glow Shadow installer. |
| **Discord typing alert** | Every file inside `overlays/typing-notifications/`, plus [`integrations/vencord/TypingNotifications/index.tsx`](integrations/vencord/TypingNotifications/index.tsx) | OBS Studio, Discord Desktop, Node.js 22 or newer, pnpm 11.9.0, and Vencord source. Git is optional. |

For a single linked file:

1. Open the file link in the table.
2. Select **Download raw file** near the top-right of the GitHub file page.
3. Save it with the original filename inside a permanent folder.
4. Do not move it after adding it to OBS, because OBS remembers its file path.

For the Discord typing alert, downloading the repository ZIP is usually easier
because that feature needs several files from two folders. Downloading the ZIP
does **not** install every overlay; it only copies the files to your computer.
You may delete or ignore every folder not listed in the table above.

You do not need `.github/`, `docs/`, `scripts/`, or the other overlay folders to
use one standalone overlay.

## Download the whole ZIP (optional easiest method)
"""

          if "## Download only the overlay you want" not in text:
              if marker not in text:
                  raise SystemExit("Beginner download heading was not found.")
              path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

      - name: Validate repository
        run: |
          node scripts/validate-repository.mjs
          node scripts/test-countdown-lifecycle.mjs

      - name: Restore normal workflow and commit
        run: |
          cat > .github/workflows/validate.yml <<'EOF'
          name: Validate overlays

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            repository-and-bridge:
              name: Repository and bridge checks
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Node.js 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: overlays/typing-notifications/package-lock.json

                - name: Validate repository files
                  run: node scripts/validate-repository.mjs

                - name: Test countdown lifecycle
                  run: node scripts/test-countdown-lifecycle.mjs

                - name: Install locked bridge dependency
                  working-directory: overlays/typing-notifications
                  run: npm ci

                - name: Run bridge checks
                  working-directory: overlays/typing-notifications
                  run: npm run check

            windows-launcher:
              name: Windows launcher syntax
              runs-on: windows-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Parse PowerShell launcher
                  shell: powershell
                  run: |
                    $content = Get-Content -LiteralPath "overlays/typing-notifications/start-obs.ps1" -Raw
                    [scriptblock]::Create($content) | Out-Null
                    Write-Host "PowerShell launcher parsed successfully."

            vencord-build:
              name: Validate current Vencord integration
              runs-on: ubuntu-latest
              steps:
                - name: Check out overlay repository
                  uses: actions/checkout@v4
                  with:
                    path: overlay-repo

                - name: Check out current Vencord source
                  uses: actions/checkout@v4
                  with:
                    repository: Vendicated/Vencord
                    path: vencord

                - name: Set up Node.js 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install pnpm 11.9.0
                  run: npm install --global pnpm@11.9.0

                - name: Install Vencord dependencies
                  working-directory: vencord
                  run: pnpm install --frozen-lockfile

                - name: Add TypingNotifications user plugin
                  run: |
                    mkdir -p vencord/src/userplugins/typingNotifications
                    cp overlay-repo/integrations/vencord/TypingNotifications/index.tsx vencord/src/userplugins/typingNotifications/index.tsx

                - name: Lint TypingNotifications integration
                  working-directory: vencord
                  run: pnpm exec eslint src/userplugins/typingNotifications/index.tsx

                - name: Type-check current Vencord with integration
                  working-directory: vencord
                  run: pnpm testTsc

                - name: Build current Vencord with integration
                  working-directory: vencord
                  run: pnpm build
          EOF
          rm -f .github/workflows/finalize-selective-downloads.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/validate.yml .github/workflows/finalize-selective-downloads.yml
          git commit -m "Document per-overlay downloads"
          git push
