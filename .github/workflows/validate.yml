name: Validate overlays

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-bridge:
    name: Repository and bridge checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlays/typing-notifications/package-lock.json

      - name: Validate repository files
        run: node scripts/validate-repository.mjs

      - name: Install locked bridge dependency
        working-directory: overlays/typing-notifications
        run: npm ci

      - name: Run bridge checks
        working-directory: overlays/typing-notifications
        run: npm run check

  windows-launcher:
    name: Windows launcher syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell launcher
        shell: powershell
        run: |
          $content = Get-Content -LiteralPath "overlays/typing-notifications/start-obs.ps1" -Raw
          [scriptblock]::Create($content) | Out-Null
          Write-Host "PowerShell launcher parsed successfully."

  vencord-build:
    name: Validate current Vencord integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out overlay repository
        uses: actions/checkout@v4
        with:
          path: overlay-repo

      - name: Check out current Vencord source
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm 11.9.0
        run: npm install --global pnpm@11.9.0

      - name: Install Vencord dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Add TypingNotifications user plugin
        run: |
          mkdir -p vencord/src/userplugins/typingNotifications
          cp overlay-repo/integrations/vencord/TypingNotifications/index.tsx vencord/src/userplugins/typingNotifications/index.tsx

      - name: Lint TypingNotifications integration
        working-directory: vencord
        run: pnpm exec eslint src/userplugins/typingNotifications/index.tsx

      - name: Type-check current Vencord with integration
        working-directory: vencord
        run: pnpm testTsc

      - name: Build current Vencord with integration
        working-directory: vencord
        run: pnpm build
