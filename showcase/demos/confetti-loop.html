<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confetti Showcase Loop</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <script>
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const LOOP_COOLDOWN_MS = 600;

    let width;
    let height;
    let pieces = [];
    let animationRunning = false;
    let loopTimer = null;

    const colours = [
      "#ff0000",
      "#ff7a00",
      "#ffe600",
      "#24d05a",
      "#00cfff",
      "#2878ff",
      "#754cff",
      "#ff35b8"
    ];

    function resizeCanvas() {
      const scale = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * scale;
      canvas.height = height * scale;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    }

    function createConfettiRain() {
      clearTimeout(loopTimer);
      loopTimer = null;

      for (let i = 0; i < 260; i++) {
        pieces.push({
          x: Math.random() * width,
          y: -20 - Math.random() * 180,
          vx: -1.2 + Math.random() * 2.4,
          vy: 2 + Math.random() * 4,
          gravity: 0.025 + Math.random() * 0.04,
          width: 5 + Math.random() * 7,
          height: 8 + Math.random() * 12,
          rotation: Math.random() * Math.PI,
          rotationSpeed: -0.15 + Math.random() * 0.3,
          life: 400 + Math.random() * 180,
          colour: colours[Math.floor(Math.random() * colours.length)]
        });
      }

      if (!animationRunning) {
        animationRunning = true;
        requestAnimationFrame(animate);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      pieces = pieces.filter(
        piece => piece.life > 0 && piece.y < height + 50
      );

      for (const piece of pieces) {
        piece.x += piece.vx;
        piece.y += piece.vy;
        piece.vy += piece.gravity;
        piece.rotation += piece.rotationSpeed;
        piece.life--;

        ctx.save();
        ctx.translate(piece.x, piece.y);
        ctx.rotate(piece.rotation);
        ctx.fillStyle = piece.colour;
        ctx.globalAlpha = Math.min(1, piece.life / 40);
        ctx.fillRect(
          -piece.width / 2,
          -piece.height / 2,
          piece.width,
          piece.height
        );
        ctx.restore();
      }

      if (pieces.length > 0) {
        requestAnimationFrame(animate);
      } else {
        animationRunning = false;
        loopTimer = setTimeout(createConfettiRain, LOOP_COOLDOWN_MS);
      }
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("load", () => {
      resizeCanvas();
      createConfettiRain();
    });
  </script>
</body>
</html>
