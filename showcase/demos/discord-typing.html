<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Typing Alert Demo</title>
  <style>
    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @property --shiny-gradient-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: true;
    }

    @property --shiny-stroke-alpha {
      syntax: "<number>";
      initial-value: 1;
      inherits: true;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "OpenAI Sans", ui-sans-serif, system-ui, sans-serif;
    }

    #stack {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .toast {
      --shiny-cta-bg: #fff;
      --shiny-cta-bg-subtle: #dedede;
      --shiny-stroke-alpha: 1;
      --shiny-cta-highlight: rgb(220 38 38 / var(--shiny-stroke-alpha));
      --shiny-gradient-shine: rgb(239 68 68 / var(--shiny-stroke-alpha));
      --shiny-cta-highlight-clear: rgb(220 38 38 / 0%);
      --shiny-cta-highlight-glow: rgb(220 38 38 / 34%);
      --shiny-cta-shine-glow: rgb(239 68 68 / 55%);
      --shiny-gradient-percent: 5%;
      --shiny-duration: 1.2s;
      --shiny-shadow-size: 2px;

      position: relative;
      isolation: isolate;
      width: min(500px, calc(100vw - 40px));
      aspect-ratio: 500 / 118;
      min-height: 96px;
      padding: 10px 18px 11px;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 10px;
      background:
        linear-gradient(var(--shiny-cta-bg), var(--shiny-cta-bg)) padding-box,
        conic-gradient(
          from var(--shiny-gradient-angle),
          var(--shiny-cta-highlight-clear),
          var(--shiny-cta-highlight) var(--shiny-gradient-percent),
          var(--shiny-gradient-shine) calc(var(--shiny-gradient-percent) * 2),
          var(--shiny-cta-highlight) calc(var(--shiny-gradient-percent) * 3),
          var(--shiny-cta-highlight-clear) calc(var(--shiny-gradient-percent) * 4),
          var(--shiny-cta-highlight-clear)
        ) border-box;
      box-shadow: inset 0 0 0 1px var(--shiny-cta-bg-subtle);
      color: #111;
      opacity: 0;
      transform: translateY(-32px);
      will-change: opacity, transform;
      animation:
        demo-cycle 6s cubic-bezier(.22, .61, .36, 1) infinite,
        shiny-gradient-angle var(--shiny-duration) linear infinite;
    }

    .toast::before,
    .toast::after,
    .shiny-cta-glow::before {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      content: "";
      pointer-events: none;
      translate: -50% -50%;
    }

    .toast::before {
      --size: calc(100% - var(--shiny-shadow-size) * 3);
      --position: 2px;
      --space: calc(var(--position) * 2);

      width: var(--size);
      height: var(--size);
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--position) var(--position),
        var(--shiny-gradient-shine) calc(var(--position) / 4),
        transparent 0
      ) padding-box;
      background-repeat: space;
      background-size: var(--space) var(--space);
      opacity: .4;
      -webkit-mask-image: conic-gradient(
        from var(--shiny-gradient-angle),
        #000 0 calc(var(--shiny-gradient-percent) * 4),
        transparent calc(var(--shiny-gradient-percent) * 4.5) 100%
      );
      mask-image: conic-gradient(
        from var(--shiny-gradient-angle),
        #000 0 calc(var(--shiny-gradient-percent) * 4),
        transparent calc(var(--shiny-gradient-percent) * 4.5) 100%
      );
    }

    .toast::after {
      width: 100%;
      height: 100%;
      background: conic-gradient(
        from var(--shiny-gradient-angle),
        transparent,
        var(--shiny-cta-highlight-glow) var(--shiny-gradient-percent),
        var(--shiny-cta-shine-glow) calc(var(--shiny-gradient-percent) * 2),
        var(--shiny-cta-highlight-glow) calc(var(--shiny-gradient-percent) * 3),
        transparent calc(var(--shiny-gradient-percent) * 4),
        transparent
      );
      opacity: 1;
      -webkit-mask-image: radial-gradient(
        ellipse at center,
        transparent 0 48%,
        #000 78% 100%
      );
      mask-image: radial-gradient(
        ellipse at center,
        transparent 0 48%,
        #000 78% 100%
      );
    }

    .shiny-cta-glow {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .header-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      text-align: center;
    }

    .title {
      color: #111;
      font-size: clamp(.88rem, 3.2vw, 1.2rem);
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .typing-row {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      min-height: 60px;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
      transform: translateY(-2px);
    }

    .avatar {
      display: grid;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      place-items: center;
      border: 1px solid #dedede;
      border-radius: 50%;
      background: #f3f3f3;
      color: #555961;
      font-size: .82rem;
      font-weight: 700;
    }

    .typing-copy {
      flex: 0 1 auto;
      width: max-content;
      min-width: 0;
      max-width: 100%;
      text-align: left;
    }

    .value {
      display: flex;
      width: max-content;
      max-width: 100%;
      min-width: 0;
      align-items: baseline;
      gap: .24em;
      color: #111;
      font-size: clamp(1.35rem, 7vw, 2.8rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.05em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .username {
      display: block;
      min-width: 0;
      flex: 0 1 auto;
      max-width: 100%;
      min-height: calc(1.12em + 12px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-bottom: 12px;
    }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: baseline;
      gap: .16em;
      color: #666a70;
      font-size: clamp(.62rem, 2.2vw, .78rem);
      font-weight: 500;
      letter-spacing: .04em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes shiny-gradient-angle {
      0% {
        --shiny-gradient-angle: 0deg;
        --shiny-stroke-alpha: .18;
      }

      50% {
        --shiny-gradient-angle: 180deg;
        --shiny-stroke-alpha: 1;
      }

      100% {
        --shiny-gradient-angle: 360deg;
        --shiny-stroke-alpha: .18;
      }
    }

    @keyframes demo-cycle {
      0%, 8%, 92%, 100% {
        opacity: 0;
        transform: translateY(-32px);
      }

      16%, 84% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 430px) {
      #stack {
        padding: 10px;
      }

      .toast {
        width: calc(100vw - 20px);
        min-height: 96px;
        padding-inline: 10px;
      }

      .typing-row {
        gap: 10px;
      }

      .avatar {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast,
      .toast::before,
      .toast::after {
        animation: none;
      }

      .toast {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="stack">
    <div class="toast" role="img" aria-label="#test-channel: Test User is typing">
      <span class="shiny-cta-glow" aria-hidden="true"></span>

      <div class="header-row">
        <div class="title">#test-channel</div>
      </div>

      <div class="typing-row">
        <div class="avatar" aria-hidden="true">TU</div>

        <div class="typing-copy">
          <div class="value">
            <span class="username">@Test User</span>
            <span class="status">
              <span>is</span>
              <span>typing</span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
