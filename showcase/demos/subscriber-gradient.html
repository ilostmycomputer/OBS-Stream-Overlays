<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriber Gradient Demo</title>
  <style>
    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: visible;
      background: transparent;
    }

    body {
      position: relative;
    }

    .stage {
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      overflow: visible;
    }

    .counter {
      --digit-height: 1.14em;
      position: relative;
      display: inline-grid;
      place-items: center;
      text-align: center;
      transform: translateY(-0.25em);
      font-family: "OpenAI Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(88px, 22vw, 132px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      white-space: nowrap;
      overflow: visible;
      opacity: 0;
    }

    .counter.is-ready {
      opacity: 1;
    }

    .counter > span {
      grid-area: 1 / 1;
      display: inline-block;
      box-sizing: border-box;
      padding: 0.30em 0.36em;
      margin: -0.30em -0.36em;
      overflow: visible;
      font: inherit;
      letter-spacing: inherit;
      font-variant-numeric: inherit;
      font-feature-settings: inherit;
      line-height: inherit;
      white-space: inherit;
    }

    .comma {
      position: relative;
      top: 0.15em;
      display: inline-block;
      width: 0.28em;
      font: inherit;
      font-size: 0.72em;
      line-height: 1;
      text-align: center;
      margin-left: -0.02em;
      margin-right: 0.02em;
    }


    .fill .comma {
      color: #fff;
      -webkit-text-fill-color: #fff;
    }

    .digit-window {
      position: relative;
      top: 3px;
      display: inline-block;
      flex: 0 0 0.82em;
      width: 0.82em;
      height: var(--digit-height);
      overflow: hidden;
      vertical-align: top;
    }

    .digit-strip {
      display: flex;
      flex-direction: column;
      width: 100%;
      transform: translateY(0);
      transition: transform 420ms cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .digit-strip.is-rolling {
      transform: translateY(calc(-1 * var(--digit-height)));
    }

    .digit-strip.is-rolling-down {
      transform: translateY(calc(-1 * var(--digit-height)));
    }

    .digit-strip.is-rolling-down.is-rolling-down-active {
      transform: translateY(0);
    }

    .digit-face {
      display: block;
      flex: 0 0 var(--digit-height);
      box-sizing: border-box;
      width: 100%;
      height: var(--digit-height);
      padding-top: 0.02em;
      line-height: 1.08em;
      text-align: center;
    }

    .stroke {
      position: absolute;
      inset: 0;
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 0;
    }

    .fill {
      position: relative;
      z-index: 1;
      color: #fff;
      -webkit-text-fill-color: #fff;
    }

    @property --gradient-angle {
      syntax: "<angle>";
      initial-value: -45deg;
      inherits: false;
    }

    @keyframes rotate-gradient {
      to {
        --gradient-angle: 315deg;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gradient-motion {
        display: none;
      }

      .digit-strip {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <svg width="1" height="1" aria-hidden="true" focusable="false" style="position:absolute; overflow:visible">
    <filter id="outline-filter" x="-2000%" y="-2000%" width="4100%" height="4100%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceGraphic" operator="dilate" radius="4.5" result="dilated" />
      <feComposite in="dilated" in2="SourceGraphic" operator="out" result="outline" />
      <feMerge>
        <feMergeNode in="outline" />
      </feMerge>
    </filter>
  </svg>

  <div class="stage">
    <div class="counter" id="counter" role="img" aria-label="Subscriber count 3,145">
      <svg class="stroke" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <defs id="stroke-defs">
          <linearGradient id="subscriber-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#e8c94c" />
            <stop offset="25%" stop-color="#facc15" />
            <stop offset="50%" stop-color="#ca8a04" />
            <stop offset="75%" stop-color="#facc15" />
            <stop offset="100%" stop-color="#e8c94c" />
            <animateTransform id="gradient-motion" attributeName="gradientTransform" type="rotate" dur="6s" repeatCount="indefinite" />
          </linearGradient>
        </defs>
        <g id="stroke-content"></g>
      </svg>
      <span class="fill" aria-hidden="true"></span>
    </div>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const counter = document.getElementById("counter");
    const fillLayer = counter.querySelector(".fill");
    const strokeSvg = counter.querySelector(".stroke");
    const strokeDefs = counter.querySelector("#stroke-defs");
    const strokeContent = counter.querySelector("#stroke-content");
    const gradient = counter.querySelector("#subscriber-gradient");
    const gradientMotion = counter.querySelector("#gradient-motion");
    const START_COUNT = 3145;
    const MIN_COUNT = 3140;
    const MAX_COUNT = 3165;
    const UPWARD_CHANCE = 0.82;
    let currentCount = START_COUNT;
    let renderedValue = null;
    let strokeGeneration = 0;

    function svgElement(name) {
      return document.createElementNS(SVG_NS, name);
    }

    function formatCount(value) {
      return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function createDigitFace(digit) {
      const face = document.createElement("span");
      face.className = "digit-face";
      face.textContent = digit;
      return face;
    }

    function createStaticDigit(digit) {
      const digitWindow = document.createElement("span");
      digitWindow.className = "digit-window";
      digitWindow.dataset.digit = digit;
      digitWindow.append(createDigitFace(digit));
      return digitWindow;
    }

    function createComma() {
      const comma = document.createElement("span");
      comma.className = "comma";
      comma.textContent = ",";
      return comma;
    }

    function createStaticTokens(formatted) {
      return [...formatted].map(character =>
        character === "," ? createComma() : createStaticDigit(character)
      );
    }

    function rollDigit(currentWindow, nextDigit, countDirection) {
      const currentDigit = currentWindow.dataset.digit;
      if (currentDigit === nextDigit) return currentWindow;

      const isDecreasing = countDirection < 0;
      const rollingWindow = document.createElement("span");
      rollingWindow.className = "digit-window";
      rollingWindow.dataset.digit = nextDigit;

      const strip = document.createElement("span");
      strip.className = "digit-strip";

      if (isDecreasing) {
        strip.classList.add("is-rolling-down");
        strip.append(createDigitFace(nextDigit), createDigitFace(currentDigit));
      } else {
        strip.append(createDigitFace(currentDigit), createDigitFace(nextDigit));
      }

      rollingWindow.append(strip);
      currentWindow.replaceWith(rollingWindow);

      let settled = false;
      const settleDigit = () => {
        if (settled) return;
        settled = true;

        if (rollingWindow.isConnected) {
          rollingWindow.replaceChildren(createDigitFace(nextDigit));
        }
      };

      strip.addEventListener("transitionend", settleDigit, { once: true });
      strip.getBoundingClientRect();
      requestAnimationFrame(() => {
        strip.classList.add(isDecreasing ? "is-rolling-down-active" : "is-rolling");
      });
      setTimeout(settleDigit, 520);

      return rollingWindow;
    }

    function renderLayer(layer, value, animate = true, countDirection = 1) {
      const formatted = formatCount(value);
      const digits = formatted.replace(",", "");
      const currentWindows = [...layer.children].filter(child =>
        child.classList.contains("digit-window")
      );

      if (!animate || currentWindows.length !== digits.length) {
        layer.replaceChildren(...createStaticTokens(formatted));
        return;
      }

      [...digits].forEach((digit, index) => {
        rollDigit(currentWindows[index], digit, countDirection);
      });
    }

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function captureStrokeGeometry() {
      const counterRect = counter.getBoundingClientRect();
      const digitWindows = [...fillLayer.children].filter(child =>
        child.classList.contains("digit-window")
      );
      const comma = fillLayer.querySelector(".comma");

      if (digitWindows.length === 0 || !comma) return null;

      const digits = digitWindows.map(windowElement => {
        const windowRect = windowElement.getBoundingClientRect();
        const face = windowElement.querySelector(".digit-face");
        const faceRect = face ? face.getBoundingClientRect() : windowRect;

        return {
          x: windowRect.left - counterRect.left,
          y: windowRect.top - counterRect.top,
          width: windowRect.width,
          height: windowRect.height,
          centerX: windowRect.left - counterRect.left + windowRect.width / 2,
          faceTop: faceRect.top - counterRect.top,
          fontSize: Number.parseFloat(getComputedStyle(face ?? windowElement).fontSize)
        };
      });

      const commaRect = comma.getBoundingClientRect();
      const commaStyle = getComputedStyle(comma);

      return {
        width: counterRect.width,
        height: counterRect.height,
        digits,
        comma: {
          centerX: commaRect.left - counterRect.left + commaRect.width / 2,
          faceTop: commaRect.top - counterRect.top,
          fontSize: Number.parseFloat(commaStyle.fontSize)
        }
      };
    }

    function updateStrokeViewport(geometry) {
      strokeSvg.setAttribute("viewBox", "0 0 " + geometry.width + " " + geometry.height);
      gradient.setAttribute("x2", String(geometry.width));

      const centerX = geometry.width / 2;
      const centerY = geometry.height / 2;
      const rotationStart = "-45 " + centerX + " " + centerY;
      const rotationEnd = "315 " + centerX + " " + centerY;

      gradient.setAttribute("gradientTransform", "rotate(" + rotationStart + ")");
      gradientMotion.setAttribute("from", rotationStart);
      gradientMotion.setAttribute("to", rotationEnd);
    }

    function createStrokeText(character, geometry, top, parent) {
      const text = svgElement("text");
      text.textContent = character;
      text.setAttribute("x", String(geometry.centerX));
      text.setAttribute("y", "0");
      text.setAttribute("font-family", '"OpenAI Sans", ui-sans-serif, system-ui, sans-serif');
      text.setAttribute("font-size", String(geometry.fontSize));
      text.setAttribute("font-weight", "700");
      text.setAttribute("font-variant-numeric", "tabular-nums");
      text.setAttribute("font-feature-settings", '"tnum" 1');
      text.setAttribute("letter-spacing", character === "," ? "0" : "-0.05em");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "none");
      text.setAttribute("stroke", "url(#subscriber-gradient)");
      text.setAttribute("stroke-width", "9");
      text.setAttribute("stroke-linejoin", "round");
      text.setAttribute("stroke-linecap", "round");
      parent.append(text);

      const bounds = text.getBBox();
      text.setAttribute("y", String(top - bounds.y));
      return text;
    }

    function createStrokeClip(geometry, clipId) {
      const clipPath = svgElement("clipPath");
      clipPath.id = clipId;
      clipPath.setAttribute("clipPathUnits", "userSpaceOnUse");

      const clipRect = svgElement("rect");
      clipRect.setAttribute("x", String(geometry.x));
      clipRect.setAttribute("y", String(geometry.y));
      clipRect.setAttribute("width", String(geometry.width));
      clipRect.setAttribute("height", String(geometry.height));
      clipPath.append(clipRect);
      strokeDefs.append(clipPath);

      return clipId;
    }

    function createRollingStroke(currentDigit, nextDigit, geometry, countDirection, clipId) {
      const isDecreasing = countDirection < 0;
      const group = svgElement("g");
      group.classList.add("stroke-digit-strip");
      group.setAttribute("clip-path", "url(#" + clipId + ")");
      strokeContent.append(group);

      if (isDecreasing) {
        createStrokeText(nextDigit, geometry, geometry.faceTop, group);
        createStrokeText(currentDigit, geometry, geometry.faceTop + geometry.height, group);
        group.setAttribute("transform", "translate(0 " + (-geometry.height) + ")");
      } else {
        createStrokeText(currentDigit, geometry, geometry.faceTop, group);
        createStrokeText(nextDigit, geometry, geometry.faceTop + geometry.height, group);
      }

      const finishTransform = isDecreasing ? "translate(0 0)" : "translate(0 " + (-geometry.height) + ")";
      const motion = svgElement("animateTransform");
      motion.setAttribute("attributeName", "transform");
      motion.setAttribute("attributeType", "XML");
      motion.setAttribute("type", "translate");
      motion.setAttribute("from", isDecreasing ? "0 " + (-geometry.height) : "0 0");
      motion.setAttribute("to", isDecreasing ? "0 0" : "0 " + (-geometry.height));
      motion.setAttribute("dur", "420ms");
      motion.setAttribute("fill", "freeze");
      group.append(motion);

      const settle = () => {
        if (!group.isConnected) return;
        group.removeAttribute("transform");
        group.replaceChildren();
        createStrokeText(nextDigit, geometry, geometry.faceTop, group);
      };

      if (prefersReducedMotion()) {
        settle();
      } else {
        requestAnimationFrame(() => {
          if (typeof motion.beginElement === "function") {
            motion.beginElement();
          } else {
            group.setAttribute("transform", finishTransform);
          }
        });
        setTimeout(settle, 520);
      }
    }

    function renderStroke(formatted, animate, countDirection, geometry) {
      if (!geometry) return;

      updateStrokeViewport(geometry);
      strokeGeneration += 1;
      strokeDefs.querySelectorAll("clipPath").forEach(clipPath => clipPath.remove());
      strokeContent.replaceChildren();

      const previous = renderedValue ?? formatted;
      const previousDigits = previous.replace(",", "");
      const nextDigits = formatted.replace(",", "");
      let digitIndex = 0;

      [...formatted].forEach(character => {
        if (character === ",") {
          createStrokeText(character, geometry.comma, geometry.comma.faceTop, strokeContent);
          return;
        }

        const digitGeometry = geometry.digits[digitIndex];
        const currentDigit = previousDigits[digitIndex] ?? character;
        const clipId = "stroke-clip-" + strokeGeneration + "-" + digitIndex;
        const changed = currentDigit !== character;

        if (animate && changed) {
          createStrokeClip(digitGeometry, clipId);
          createRollingStroke(currentDigit, character, digitGeometry, countDirection, clipId);
        } else {
          createStrokeText(character, digitGeometry, digitGeometry.faceTop, strokeContent);
        }

        digitIndex += 1;
      });

      renderedValue = formatted;
    }

    function renderCount(value, animate = true, countDirection = 1) {
      const formatted = formatCount(value);

      if (renderedValue === null) {
        renderLayer(fillLayer, value, false);
        renderStroke(formatted, false, countDirection, captureStrokeGeometry());
      } else {
        const geometry = captureStrokeGeometry();
        renderLayer(fillLayer, value, animate, countDirection);
        renderStroke(formatted, animate, countDirection, geometry);
      }

      counter.setAttribute("aria-label", "Subscriber count " + formatted);
    }

    document.fonts.load('700 132px "OpenAI Sans"', '3,145').then(() => {
      renderCount(currentCount, false);
      counter.classList.add("is-ready");
      window.setInterval(advanceCount, 1800);
    });
  </script>
</body>
</html>
