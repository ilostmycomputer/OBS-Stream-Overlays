<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriber Gradient Demo</title>
  <style>
    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .subscriber-text,
    .subscriber-stroke {
      font-family: "OpenAI Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(72px, 17vw, 132px);
      font-weight: 700;
      font-style: normal;
      line-height: 1;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      white-space: nowrap;
    }

    .subscriber-text {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      transform: translate(-50%, -50%);
      color: #fff;
    }

    .stroke-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
    }

    .subscriber-stroke {
      text-anchor: middle;
      dominant-baseline: middle;
      fill: none;
      stroke: url(#subscriber-gradient);
      stroke-width: 9px;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: url(#soft-glow);
    }

    .stage {
      opacity: 0;
    }

    .stage.is-ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img" aria-label="Subscriber count 3,145">
    <svg class="stroke-layer" aria-hidden="true">
      <defs>
        <linearGradient id="subscriber-gradient" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fde047" />
          <stop offset="0.25" stop-color="#facc15" />
          <stop offset="0.5" stop-color="#ca8a04" />
          <stop offset="0.75" stop-color="#facc15" />
          <stop offset="1" stop-color="#fde047" />
          <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite" />
        </linearGradient>
        <filter id="soft-glow" x="-30%" y="-40%" width="160%" height="180%">
          <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#facc15" flood-opacity="0.22" />
        </filter>
      </defs>
      <text class="subscriber-stroke" x="50%" y="50%">3,145</text>
    </svg>

    <div class="subscriber-text">3,145</div>
  </div>

  <script>
    const stage = document.getElementById("stage");

    document.fonts.load('700 132px "OpenAI Sans"', '3,145').then(() => {
      stage.classList.add("is-ready");
    });
  </script>
</body>
</html>
