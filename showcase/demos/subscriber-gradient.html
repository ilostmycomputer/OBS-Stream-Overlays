<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriber Gradient Demo</title>
  <style>
    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: visible;
    }

    .counter {
      display: inline-grid;
      place-items: center;
      text-align: center;
      transform: translateY(0.055em);
      font-family: "OpenAI Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(88px, 22vw, 132px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      white-space: nowrap;
      overflow: visible;
      opacity: 0;
    }

    .counter.is-ready {
      opacity: 1;
    }

    .counter > span {
      grid-area: 1 / 1;
      display: inline-block;
      box-sizing: border-box;
      padding: 0.30em 0.36em;
      margin: -0.30em -0.36em;
      overflow: visible;
      font: inherit;
      letter-spacing: inherit;
      font-variant-numeric: inherit;
      font-feature-settings: inherit;
      line-height: inherit;
      white-space: inherit;
    }

    .comma {
      display: inline-block;
      margin-left: -0.075em;
      margin-right: -0.085em;
    }

    .stroke {
      color: transparent;
      background: conic-gradient(
        from var(--gradient-angle),
        #fde047 0deg,
        #facc15 90deg,
        #ca8a04 180deg,
        #facc15 270deg,
        #fde047 360deg
      );
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: url(#outline-filter);
      animation: rotate-gradient 6s linear infinite;
    }

    .fill {
      position: relative;
      color: #fff;
      -webkit-text-fill-color: #fff;
    }

    @property --gradient-angle {
      syntax: "<angle>";
      initial-value: -45deg;
      inherits: false;
    }

    @keyframes rotate-gradient {
      to {
        --gradient-angle: 315deg;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute; overflow:visible">
    <filter id="outline-filter" x="-1200%" y="-1200%" width="2500%" height="2500%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceGraphic" operator="dilate" radius="4.5" result="dilated" />
      <feComposite in="dilated" in2="SourceGraphic" operator="out" result="outline" />
      <feMerge>
        <feMergeNode in="outline" />
      </feMerge>
    </filter>
  </svg>

  <div class="stage">
    <div class="counter" id="counter" role="img" aria-label="Subscriber count 3,145">
      <span class="stroke" aria-hidden="true">3<span class="comma">,</span>145</span>
      <span class="fill">3<span class="comma">,</span>145</span>
    </div>
  </div>

  <script>
    const counter = document.getElementById("counter");

    document.fonts.load('700 132px "OpenAI Sans"', '3,145').then(() => {
      counter.classList.add("is-ready");
    });
  </script>
</body>
</html>
