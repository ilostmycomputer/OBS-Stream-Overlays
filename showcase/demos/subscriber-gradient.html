<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriber Gradient Demo</title>
  <style>
    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="demo" aria-label="Animated subscriber count around 3,145 with a rotating yellow gradient stroke"></canvas>

  <script>
    const canvas = document.getElementById("demo");
    const ctx = canvas.getContext("2d");

    const ROTATION_MS = 6000;
    const ROLL_MS = 420;
    const MIN_COUNT = 3000;
    const MAX_COUNT = 3299;

    // Match the approved stream countdown geometry exactly.
    const DIGIT_HEIGHT_EM = 1.14;
    const DIGIT_WIDTH_EM = 0.64;
    const SEPARATOR_WIDTH_EM = 0.42;
    const FACE_LINE_HEIGHT_EM = 1.08;
    const FACE_PADDING_TOP_EM = 0.02;
    const WINDOW_TOP_PX = 3;

    let width = 0;
    let height = 0;
    let count = 3145;
    let previousCount = count;
    let targetCount = count;
    let rollStartedAt = -Infinity;
    let rollDirection = 1;
    let nextChangeAt = performance.now() + 900;

    function resize() {
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    }

    function formatCount(value) {
      return value.toLocaleString("en-GB");
    }

    function scheduleCountChange(now) {
      const magnitude = 1 + Math.floor(Math.random() * 8);
      const direction = Math.random() < 0.5 ? -1 : 1;
      const next = Math.max(MIN_COUNT, Math.min(MAX_COUNT, count + direction * magnitude));

      if (next === count) {
        nextChangeAt = now + 700;
        return;
      }

      previousCount = count;
      targetCount = next;
      count = next;
      rollDirection = targetCount > previousCount ? 1 : -1;
      rollStartedAt = now;
      nextChangeAt = now + ROLL_MS + 850 + Math.random() * 1250;
    }

    function easeCountdown(t) {
      // Matches cubic-bezier(0.22, 0.61, 0.36, 1) closely without changing timing.
      return 1 - Math.pow(1 - t, 3);
    }

    function createStrokeGradient(now, centreX, centreY) {
      const angle = ((now % ROTATION_MS) / ROTATION_MS) * Math.PI * 2 - Math.PI / 4;
      const gradient = ctx.createConicGradient(angle, centreX, centreY);
      gradient.addColorStop(0, "#fde047");
      gradient.addColorStop(0.25, "#facc15");
      gradient.addColorStop(0.5, "#ca8a04");
      gradient.addColorStop(0.75, "#facc15");
      gradient.addColorStop(1, "#fde047");
      return gradient;
    }

    function drawGlyph(glyph, x, y, gradient, fontSize) {
      ctx.shadowColor = "rgba(250, 204, 21, 0.22)";
      ctx.shadowBlur = 14;
      ctx.lineWidth = Math.max(4, fontSize * 0.085);
      ctx.strokeStyle = gradient;
      ctx.strokeText(glyph, x, y);

      ctx.shadowBlur = 0;
      ctx.fillStyle = "#f5f5f5";
      ctx.fillText(glyph, x, y);
    }

    function drawDigitWindow(oldGlyph, newGlyph, slotX, centreY, geometry, gradient, progress, rolling) {
      const { digitWidth, digitHeight, faceHeight, facePaddingTop, strokePad } = geometry;
      const eased = easeCountdown(progress);
      const travel = digitHeight;

      ctx.save();
      ctx.beginPath();
      ctx.rect(
        slotX - digitWidth / 2 - strokePad,
        centreY - digitHeight / 2 + WINDOW_TOP_PX,
        digitWidth + strokePad * 2,
        digitHeight
      );
      ctx.clip();

      const baselineOffset = facePaddingTop + (faceHeight - fontSize) * 0.5;
      const restingY = centreY + WINDOW_TOP_PX + baselineOffset;

      if (rolling && oldGlyph !== newGlyph) {
        const oldY = restingY - rollDirection * eased * travel;
        const newY = restingY + rollDirection * (1 - eased) * travel;
        drawGlyph(oldGlyph, slotX, oldY, gradient, geometry.fontSize);
        drawGlyph(newGlyph, slotX, newY, gradient, geometry.fontSize);
      } else {
        drawGlyph(newGlyph, slotX, restingY, gradient, geometry.fontSize);
      }

      ctx.restore();
    }

    function draw(now) {
      if (now >= nextChangeAt) scheduleCountChange(now);

      ctx.clearRect(0, 0, width, height);

      // Same font sizing rule as the stream countdown: clamp(2rem, 5vw, 3.25rem).
      const fontSize = Math.min(52, Math.max(32, width * 0.05));
      const digitWidth = fontSize * DIGIT_WIDTH_EM;
      const digitHeight = fontSize * DIGIT_HEIGHT_EM;
      const faceHeight = fontSize * DIGIT_HEIGHT_EM;
      const facePaddingTop = fontSize * FACE_PADDING_TOP_EM;
      const separatorWidth = fontSize * SEPARATOR_WIDTH_EM;
      const slotWidths = [digitWidth, separatorWidth, digitWidth, digitWidth, digitWidth];
      const totalWidth = slotWidths.reduce((sum, slotWidth) => sum + slotWidth, 0);
      const centreX = width / 2;
      const centreY = height / 2;
      const gradient = createStrokeGradient(now, centreX, centreY);

      const previous = formatCount(previousCount);
      const target = formatCount(targetCount);
      const progress = Math.min(1, Math.max(0, (now - rollStartedAt) / ROLL_MS));
      const rolling = progress < 1;

      const geometry = {
        fontSize,
        digitWidth,
        digitHeight,
        faceHeight: fontSize * FACE_LINE_HEIGHT_EM,
        facePaddingTop,
        strokePad: Math.max(4, fontSize * 0.09),
      };

      ctx.save();
      ctx.font = `700 ${fontSize}px "OpenAI Sans", ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      let cursor = centreX - totalWidth / 2;

      for (let index = 0; index < slotWidths.length; index++) {
        const slotWidth = slotWidths[index];
        const slotX = cursor + slotWidth / 2;
        const oldGlyph = previous[index];
        const newGlyph = target[index];

        if (newGlyph === ",") {
          drawGlyph(",", slotX, centreY + WINDOW_TOP_PX, gradient, fontSize);
        } else {
          drawDigitWindow(oldGlyph, newGlyph, slotX, centreY, geometry, gradient, progress, rolling);
        }

        cursor += slotWidth;
      }

      ctx.restore();

      if (!rolling && previousCount !== targetCount) {
        previousCount = targetCount;
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    document.fonts.ready.finally(() => requestAnimationFrame(draw));
  </script>
</body>
</html>
