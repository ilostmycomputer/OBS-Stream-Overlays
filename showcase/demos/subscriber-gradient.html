<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriber Gradient Demo</title>
  <style>
    @font-face {
      font-family: "OpenAI Sans";
      src: url("../../Overlays%20%26%20Plugins/overlays/countdown/OpenAI-Sans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .subscriber-count {
      font-family: "OpenAI Sans";
      font-size: 132px;
      font-weight: 700;
      letter-spacing: -5px;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke fill;
      fill: #ffffff;
      stroke: url(#subscriber-gradient);
      stroke-width: 9px;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: url(#soft-glow);
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 700 394" role="img" aria-label="Subscriber count 3,145">
    <defs>
      <linearGradient id="subscriber-gradient" gradientUnits="userSpaceOnUse" x1="180" y1="40" x2="520" y2="354">
        <stop offset="0" stop-color="#fde047" />
        <stop offset="0.25" stop-color="#facc15" />
        <stop offset="0.5" stop-color="#ca8a04" />
        <stop offset="0.75" stop-color="#facc15" />
        <stop offset="1" stop-color="#fde047" />
        <animateTransform
          attributeName="gradientTransform"
          type="rotate"
          from="0 350 197"
          to="360 350 197"
          dur="6s"
          repeatCount="indefinite" />
      </linearGradient>

      <filter id="soft-glow" x="-30%" y="-40%" width="160%" height="180%">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#facc15" flood-opacity="0.22" />
      </filter>
    </defs>

    <text class="subscriber-count" x="350" y="197">3,145</text>
  </svg>
</body>
</html>
